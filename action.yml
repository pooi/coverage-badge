name: "Test coverage badge"
description: "Creates a coverage badge and deploys coverage reports to GitHub Pages."
author: "pooi (Taewoo You)"

inputs:
  token:
    description: 'GitHub token used for Pages deployment or branch publishing'
    required: false
    default: ${{ github.token }}
  xml-test-report-path:
    description: 'The test reporter path (xml)'
    required: true
  html-test-report-path:
    description: 'The test reporter path (html)'
    required: true
  deployment-mode:
    description: 'auto selects Pages artifacts on GitHub.com and branch publishing on GHES; pages or branch overrides it'
    required: false
    default: auto
  github-page-ref:
    description: 'Publishing branch used in branch mode'
    required: false
    default: gh-pages

outputs:
  page-url:
    description: 'URL of the deployed GitHub Pages site (empty in branch mode)'
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: composite
  steps:
    - name: Select deployment mode
      id: mode
      shell: bash
      env:
        DEPLOYMENT_MODE: ${{ inputs.deployment-mode }}
      run: |
        set -euo pipefail
        mode="$DEPLOYMENT_MODE"
        if [[ "$mode" == auto ]]; then
          if [[ "$GITHUB_SERVER_URL" == https://github.com ]]; then mode=pages; else mode=branch; fi
        fi
        case "$mode" in
          pages)
            [[ "$GITHUB_SERVER_URL" == https://github.com ]] || { echo 'Pages artifact deployment requires GitHub.com.' >&2; exit 1; }
            ;;
          branch) ;;
          *) echo 'deployment-mode must be auto, pages, or branch.' >&2; exit 1 ;;
        esac
        printf 'value=%s\n' "$mode" >> "$GITHUB_OUTPUT"
    - name: Install dependency
      run: python3 -m pip install -r "$GITHUB_ACTION_PATH/requirements.txt"
      shell: bash
    - name: Prepare coverage site
      id: site
      shell: bash
      env:
        XML_TEST_REPORT_PATH: ${{ inputs.xml-test-report-path }}
        HTML_TEST_REPORT_PATH: ${{ inputs.html-test-report-path }}
      run: |
        set -euo pipefail
        [[ -n "$XML_TEST_REPORT_PATH" ]] || { echo 'XML report path is required.' >&2; exit 1; }
        [[ -n "$HTML_TEST_REPORT_PATH" ]] || { echo 'HTML report path is required.' >&2; exit 1; }
        case "$XML_TEST_REPORT_PATH" in
          /*) ;;
          *) XML_TEST_REPORT_PATH="$GITHUB_WORKSPACE/$XML_TEST_REPORT_PATH" ;;
        esac
        case "$HTML_TEST_REPORT_PATH" in
          /*) ;;
          *) HTML_TEST_REPORT_PATH="$GITHUB_WORKSPACE/$HTML_TEST_REPORT_PATH" ;;
        esac
        [[ -f "$XML_TEST_REPORT_PATH" ]] || { echo 'XML report file does not exist.' >&2; exit 1; }
        [[ -d "$HTML_TEST_REPORT_PATH" ]] || { echo 'HTML report directory does not exist.' >&2; exit 1; }
        site_path="$(mktemp -d "$RUNNER_TEMP/coverage-pages.XXXXXX")"
        cd "$site_path"
        python3 "$GITHUB_ACTION_PATH/main.py" "$XML_TEST_REPORT_PATH"
        [[ -s coverage.svg ]] || { echo 'XML report did not produce a coverage badge.' >&2; exit 1; }
        cp -a -- "$HTML_TEST_REPORT_PATH" coverage
        printf 'path=%s\n' "$site_path" >> "$GITHUB_OUTPUT"
    - name: Upload coverage site
      if: steps.mode.outputs.value == 'pages'
      uses: actions/upload-pages-artifact@v4
      with:
        path: ${{ steps.site.outputs.path }}
    - name: Deploy coverage site
      id: deployment
      if: steps.mode.outputs.value == 'pages'
      uses: actions/deploy-pages@v4
      with:
        token: ${{ inputs.token }}
    - name: Publish coverage branch
      if: steps.mode.outputs.value == 'branch'
      shell: bash
      env:
        COVERAGE_TOKEN: ${{ inputs.token }}
        COVERAGE_SITE_PATH: ${{ steps.site.outputs.path }}
        COVERAGE_BRANCH: ${{ inputs.github-page-ref }}
      run: python3 "$GITHUB_ACTION_PATH/publish-branch.py"
